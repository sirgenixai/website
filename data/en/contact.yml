############################## Contact #############################
contact:
  enable : true
  title : Contact Us
  subtitle : Contact Details
  content : >
    We would love to hear from you. Feel free to contact us by phone or email,
    or send us your details through the form and we will get back to you at the earliest.

  # Contact details
  contact_list:
    # - icon : ti-location-pin # themify icon pack : https://themify.me/themify-icons
    #   info : "Pune, India."
   
    - icon : ti-email # themify icon pack : https://themify.me/themify-icons
      info : "Email: contact@sirgenix.ai"


  # Contact form
  contact_form:
    enable : true
    form_action : "https://formspree.io/f/manpblkn" #contact form works with https://formspree.io
    name : "Your Name"
    email : "Your Email"
    subject : "Subject"
    message : "Message"
    submit : "Submit"

    contact_submit_success: "Thank you for contacting us, we have received your message and we are on it."
    contact_submit_failure: "Please ensure all fields are appropriately filled in and try again."
